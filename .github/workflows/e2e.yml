# Extends the take-home starter workflow: same emulator setup, with the test
# framework wired in and the run moved into automation/ci/run_e2e.sh.
name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: automation

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: automation/uv.lock

      - name: Install the test framework
        run: |
          uv sync --locked
          # Pinned, not floating. `appium@2` resolves to 2.19.0, and the current
          # uiautomator2 driver wants server ^3.0.0-rc.2 - the install then fails
          # outright. These are the versions the suite was verified against.
          npm install -g appium@2.10.3
          appium driver install uiautomator2@3.5.6
          appium --version && appium driver list --installed

      # Cheap and device-free: catches lint and contract breaks before we spend
      # ten minutes booting an emulator.
      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run mypy

      # Booting the AVD cold costs ~2 minutes. Caching a booted snapshot trades
      # that for a ~40s restore. The key covers every property that changes the
      # image: a snapshot from a different api-level/arch/target/profile is not
      # interchangeable, and restoring the wrong one fails in confusing ways.
      - name: Cache the AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb_keys
          key: avd-34-x86_64-google_apis-pixel_5

      - name: Create the AVD and save a booted snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          force-avd-creation: false
          # Mirrors the run step apart from the snapshot flags. This line must
          # never be deleted: the action's default is
          #   -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # and falling back to it would silence the audio the probe reads.
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshot saved."

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Pinned: without it the screen size is whatever the action defaults to,
          # and layout-sensitive tests then pass or fail by luck.
          profile: pixel_5
          force-avd-creation: false
          # Audio is left on: `dumpsys audio` is one of the three playback signals
          # the tests assert on. That is why these options are spelled out rather
          # than defaulted - the action's default includes -noaudio.
          # -no-snapshot-save: boot from the cached snapshot, do not rewrite it,
          # so a run that dirties the device cannot poison the next one's cache.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: automation
          # One script file: the action runs each inline line in its own shell, so
          # loops and if-blocks do not survive being written inline.
          script: bash ci/run_e2e.sh

      - name: Build the Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            automation/allure-report
            automation/allure-results
            automation/appium.log
            automation/logcat.txt
            automation/pytest.log
          retention-days: 14
          if-no-files-found: warn
